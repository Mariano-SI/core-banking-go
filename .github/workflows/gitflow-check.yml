name: Gitflow Check

on:
  pull_request:
    branches: [develop, master]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gitflow-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-gitflow:
    name: check-gitflow
    runs-on: ubuntu-latest
    steps:
      - name: Validate source and target branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Lê o estado ATUAL do PR, e não a foto do evento, que pode estar desatualizada
          pr=$(gh pr view "$PR_NUMBER" --json baseRefName,headRefName,labels)
          BASE_BRANCH=$(echo "$pr" | jq -r '.baseRefName')
          HEAD_BRANCH=$(echo "$pr" | jq -r '.headRefName')
          PR_LABELS=$(echo "$pr" | jq -r '[.labels[].name] | join(",")')

          echo "Destino: $BASE_BRANCH"
          echo "Origem:  $HEAD_BRANCH"
          echo "Labels:  $PR_LABELS"

          fail() {
            echo "::error::$1"
            exit 1
          }

          case "$BASE_BRANCH" in
            master)
              case "$HEAD_BRANCH" in
                release/* | hotfix/*) ;;
                *) fail "A branch master só aceita merges de release/* ou hotfix/* (origem: $HEAD_BRANCH)." ;;
              esac
              ;;
            develop)
              if [ "$HEAD_BRANCH" = "master" ]; then
                if [[ ",$PR_LABELS," == *",backport,"* ]]; then
                  echo "Backport da master para a develop: permitido."
                  exit 0
                fi
                fail "PRs da master para a develop precisam da label backport."
              fi
              case "$HEAD_BRANCH" in
                feature/* | bugfix/* | release/* | hotfix/*) ;;
                *) fail "A branch develop só aceita merges de feature/*, bugfix/*, release/*, hotfix/* ou backport da master (origem: $HEAD_BRANCH)." ;;
              esac
              ;;
            *)
              fail "Branch de destino não prevista no Git Flow: $BASE_BRANCH."
              ;;
          esac

          echo "Fluxo válido: $HEAD_BRANCH -> $BASE_BRANCH"